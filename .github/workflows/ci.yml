name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

# Least-privilege default: this workflow only ever needs to read the checked-out code.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Fork PRs don't run automatically: gated by
    # Settings → Actions → General → "Fork pull request workflows" → require approval
    # for all outside collaborators, so a maintainer must click "Approve and run" first.

    steps:
      # ─── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v5

      # ─── Java 25 ─────────────────────────────────────────────────────────────
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # ─── Docker (required for Testcontainers) ────────────────────────────────
      - name: Verify Docker is available
        run: |
          docker --version
          docker info

      - name: Pre-pull Docker image for Testcontainers
        run: docker pull pgvector/pgvector:pg18

      # ─── Build ───────────────────────────────────────────────────────────────
      - name: Compile
        run: ./mvnw clean compile --no-transfer-progress

      # ─── Tests ───────────────────────────────────────────────────────────────
      # `verify -Pit` runs the full lifecycle: unit tests (Surefire, *Test.java) then
      # integration tests (Failsafe, *IT.java) against the Testcontainers-backed database.
      - name: Run unit and integration tests
        run: ./mvnw verify -Pit --no-transfer-progress
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: false

      # ─── Package ─────────────────────────────────────────────────────────────
      - name: Package JAR
        if: success()
        run: ./mvnw package -DskipTests --no-transfer-progress
